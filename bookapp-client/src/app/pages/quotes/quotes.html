<section>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <h1 class="mb-0"><i class="fa-solid fa-quote-left me-2" aria-hidden="true"></i>Mina citat</h1>
    <a class="btn btn-primary" routerLink="/quotes/new">
      <i class="fa-solid fa-plus me-1" aria-hidden="true"></i>Lägg till citat
    </a>
  </div>

  @if (errorMessage) {
    <div class="alert alert-danger d-flex justify-content-between align-items-center" role="alert">
      <span>{{ errorMessage }}</span>
      <button class="btn btn-sm btn-outline-danger" type="button" (click)="loadQuotes()">Försök igen</button>
    </div>
  }

  @if (isLoading) {
    <div class="text-center py-5" role="status">
      <div class="spinner-border" aria-hidden="true"></div>
      <div class="mt-2">Hämtar citat...</div>
    </div>
  } @else if (!errorMessage && quotes.length === 0) {
    <div class="alert alert-info">Du har inga citat ännu.</div>
  } @else {
    <div class="row g-4">
      @for (quote of quotes; track quote.id) {
        <div class="col-12 col-md-6 col-lg-4">
          <article class="card quote-card shadow-sm">
            <div class="card-body d-flex flex-column">
              <blockquote class="blockquote mb-3">
                <p>“{{ quote.text }}”</p>
                <footer class="blockquote-footer mt-2">{{ quote.author }}</footer>
              </blockquote>

              <div class="d-flex flex-wrap gap-2 mt-auto">
                <a class="btn btn-outline-primary btn-sm" [routerLink]="['/quotes', quote.id, 'edit']">
                  <i class="fa-solid fa-pen me-1" aria-hidden="true"></i>Edit
                </a>
                <button class="btn btn-outline-danger btn-sm" type="button" (click)="deleteQuote(quote)">
                  <i class="fa-solid fa-trash me-1" aria-hidden="true"></i>Delete
                </button>
              </div>
            </div>
          </article>
        </div>
      }
    </div>
  }
</section>
