name: Build and deploy BookApp to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: bookapp-client/package-lock.json

      - name: Install frontend dependencies
        working-directory: bookapp-client
        run: npm ci

      - name: Build Angular frontend
        working-directory: bookapp-client
        run: npm run build

      - name: Copy Angular build into .NET wwwroot
        run: |
          mkdir -p Bookapp.Api/wwwroot
          cp -R bookapp-client/dist/bookapp-client/browser/. Bookapp.Api/wwwroot/

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Restore .NET dependencies
        run: dotnet restore Bookapp.Api/Bookapp.Api.csproj

      - name: Publish .NET application
        run: dotnet publish Bookapp.Api/Bookapp.Api.csproj --configuration Release --output publish --no-restore

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: bokapp-abdirahman-taabit
          slot-name: Production
          package: publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_61E5341A3C7148E485D68C98BF115166 }}
